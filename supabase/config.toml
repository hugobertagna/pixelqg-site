# Function settings used when deploying (Supabase CLI or MCP deploy_edge_function).
[functions.license]
verify_jwt = true

[functions.admin-license]
verify_jwt = true

[functions.download]
verify_jwt = true

# Stripe signs its own requests; there is no Supabase JWT on them.
[functions.stripe-webhook]
verify_jwt = false

[functions.lemonsqueezy-webhook]
verify_jwt = false
